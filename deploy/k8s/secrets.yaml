# Placeholder Secret carrying the HMAC shared secrets every external
# service validates inbound chat-server credentials against. Production
# deployments REPLACE these stringData values via SealedSecrets or an
# external secret manager (Vault, AWS Secrets Manager, etc.) — the
# values below are non-secret placeholders that exist so `kubectl
# apply -k .` succeeds out of the box on a development cluster.
apiVersion: v1
kind: Secret
metadata:
  name: signal-shared-secrets
  namespace: signal
type: Opaque
stringData:
  # HMAC secret for storage-service (signald /v1/storage/auth +
  # storage-service Basic auth validation).
  storage-service-hmac: "CHANGE-ME-storage-service-hmac"
  # HMAC secret for svr2 (signald /v2/svr/auth + svr2 admin DELETE).
  svr2-hmac: "CHANGE-ME-svr2-hmac"
  # HMAC secret for cdsi (signald /v2/directory/auth + cdsi WebSocket
  # Basic auth).
  cdsi-hmac: "CHANGE-ME-cdsi-hmac"
  # Postgres credentials — sourced by both signald and any service
  # that wants a durable backend.
  postgres-url: "postgres://signal:CHANGE-ME@postgres:5432/signal?sslmode=disable"
