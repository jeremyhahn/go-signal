# Development and integration stack. Ports name the container port only, so docker assigns host ports; use `docker compose port` to find one.

services:
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      # No source in the image; the mount below supplies it, so a developer's
      # edits are live without a rebuild.
      target: toolchain
      # The test CA the image trusts, generated by `make test-tls` (the
      # devcontainer's initializeCommand runs it); never committed.
      additional_contexts:
        tls: ../test/tls
    volumes:
      - ..:/workspace:cached
      - go-mod-cache:/go/pkg/mod
    working_dir: /workspace
    command: sleep infinity
    environment:
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgres://signal:signal@postgres:5432/signal?sslmode=disable
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  signal-server:
    build:
      context: ..
      # Dockerfile.dev bakes the test config, stub transport and test certs; the production Dockerfile ships no config and exits without one.
      dockerfile: Dockerfile.dev
      # Module credentials as a BuildKit secret, not a build arg; unset GOMODAUTH_ENV resolves to /dev/null and the build uses the public proxy.
      secrets:
        - gomodauth
    # Dynamic host port — see the header.
    ports:
      - "8081"
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--spider", "-q", "https://localhost:8081/v1/keepalive"]
      interval: 5s
      timeout: 3s
      retries: 10

  signal-cli:
    build:
      context: ../test/signal-cli
      dockerfile: Dockerfile
      args:
        SIGNAL_SERVER_URL: https://signal-server:8081
      # Generated test CA (`make test-tls`), not a committed copy.
      additional_contexts:
        tls: ../test/tls
    volumes:
      - signal-cli-data:/var/lib/signal-cli
      - signal-cli-bin:/opt/signal-cli
    depends_on:
      signal-server:
        condition: service_healthy
    entrypoint: ["sleep", "infinity"]

  integration:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      # Source baked in, not mounted: a CI bind mount resolves on the host daemon and mounts an empty directory.
      target: integration
      additional_contexts:
        tls: ../test/tls
      secrets:
        - gomodauth
    volumes:
      - go-mod-cache:/go/pkg/mod
      - signal-cli-bin:/opt/signal-cli:ro
      - signal-cli-data:/var/lib/signal-cli
    working_dir: /workspace
    depends_on:
      signal-server:
        condition: service_healthy
      signal-cli:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SIGNAL_SERVER_URL: https://signal-server:8081
      SIGNAL_CLI_BIN: /opt/signal-cli/bin/signal-cli
      SIGNAL_CLI_DATA: /var/lib/signal-cli
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgres://signal:signal@postgres:5432/signal?sslmode=disable
      # Module credentials at run time, from the caller's environment; GIT_CONFIG_COUNT defaults to 0 because git rejects an empty count.
      GOPRIVATE: ${GOPRIVATE:-}
      GIT_CONFIG_COUNT: ${GIT_CONFIG_COUNT:-0}
      GIT_CONFIG_KEY_0: ${GIT_CONFIG_KEY_0:-}
      GIT_CONFIG_VALUE_0: ${GIT_CONFIG_VALUE_0:-}
    command: make integration-test

  redis:
    image: redis:7-alpine
    # Dynamic host port — see the header.
    ports:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: signal
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal
    # Dynamic host port — see the header.
    ports:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal -d signal"]
      interval: 5s
      timeout: 3s
      retries: 10

secrets:
  gomodauth:
    # Path to a file of `export VAR=...` lines. /dev/null when unset, which
    # makes the secret present but empty rather than failing the build.
    file: ${GOMODAUTH_ENV:-/dev/null}

volumes:
  go-mod-cache:
  signal-cli-data:
  signal-cli-bin:
  postgres-data:
  redis-data:
