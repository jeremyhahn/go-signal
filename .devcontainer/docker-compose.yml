# Development and integration stack.
#
# Every `ports:` entry names the CONTAINER port only, so docker assigns the host
# port dynamically. A fixed host binding cannot work on a shared CI runner:
# compose reaches the HOST daemon through the mounted socket, so a second job —
# or anything else already listening — collides with "failed to bind host port
# 0.0.0.0:8081: address already in use". That is what failed run 338. Nothing
# depends on the fixed numbers: every service addresses the others by compose
# service name over the compose network, and `docker compose port <service>
# <port>` reports the assigned host port when a developer wants one.

services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
      - go-mod-cache:/go/pkg/mod
    working_dir: /workspace
    command: sleep infinity
    environment:
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgres://signal:signal@postgres:5432/signal?sslmode=disable
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  signal-server:
    build:
      context: ..
      # Dockerfile.dev, not the top-level Dockerfile. The latter is the
      # production image and is deliberately fail-closed: it ships no config,
      # no secrets and no TLS material, only config.yml.example, so it exits 1
      # with "open /etc/signal-server/config.yml: no such file or directory"
      # the moment compose starts it — which is correct behaviour for a
      # production image and useless for a test stack. Dockerfile.dev exists for
      # exactly this: it bakes the in-memory test config, the stub verification
      # transport and the self-signed test certs, and listens on 8081, which is
      # the port this service publishes and health-checks.
      dockerfile: Dockerfile.dev
      # Credentials for the internal Gitea host, so the image's `go mod
      # download` can resolve first-party modules. A BuildKit secret, not a
      # build arg: an arg is recoverable from image metadata with
      # `docker history`. Where GOMODAUTH_ENV is unset the secret resolves to
      # /dev/null, the Dockerfile's mount finds nothing to source, and the
      # build falls back to the public proxy.
      secrets:
        - gomodauth
    # Dynamic host port — see the header.
    ports:
      - "8081"
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--spider", "-q", "https://localhost:8081/v1/keepalive"]
      interval: 5s
      timeout: 3s
      retries: 10

  signal-cli:
    build:
      context: ../test/signal-cli
      dockerfile: Dockerfile
      args:
        SIGNAL_SERVER_URL: https://signal-server:8081
    volumes:
      - signal-cli-data:/var/lib/signal-cli
      - signal-cli-bin:/opt/signal-cli
    depends_on:
      signal-server:
        condition: service_healthy
    entrypoint: ["sleep", "infinity"]

  integration:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
      - go-mod-cache:/go/pkg/mod
      - signal-cli-bin:/opt/signal-cli:ro
      - signal-cli-data:/var/lib/signal-cli
    working_dir: /workspace
    depends_on:
      signal-server:
        condition: service_healthy
      signal-cli:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SIGNAL_SERVER_URL: https://signal-server:8081
      SIGNAL_CLI_BIN: /opt/signal-cli/bin/signal-cli
      SIGNAL_CLI_DATA: /var/lib/signal-cli
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgres://signal:signal@postgres:5432/signal?sslmode=disable
      # This container compiles the suite itself against a bind-mounted
      # /workspace, so it needs Gitea module resolution at RUN time, not just
      # at build time. Inherited from the caller's environment — the Actions
      # runner injects all four (dependency-resolution.md §6). GIT_CONFIG_COUNT
      # defaults to 0 rather than empty: git rejects an empty count outright,
      # while 0 means "no rewrites configured", which is the correct behaviour
      # on a machine without Gitea credentials.
      GOPRIVATE: ${GOPRIVATE:-}
      GIT_CONFIG_COUNT: ${GIT_CONFIG_COUNT:-0}
      GIT_CONFIG_KEY_0: ${GIT_CONFIG_KEY_0:-}
      GIT_CONFIG_VALUE_0: ${GIT_CONFIG_VALUE_0:-}
    command: make integration-test

  redis:
    image: redis:7-alpine
    # Dynamic host port — see the header.
    ports:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: signal
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal
    # Dynamic host port — see the header.
    ports:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal -d signal"]
      interval: 5s
      timeout: 3s
      retries: 10

secrets:
  gomodauth:
    # Path to a file of `export VAR=...` lines. /dev/null when unset, which
    # makes the secret present but empty rather than failing the build.
    file: ${GOMODAUTH_ENV:-/dev/null}

volumes:
  go-mod-cache:
  signal-cli-data:
  signal-cli-bin:
  postgres-data:
  redis-data:
