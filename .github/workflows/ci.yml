# ci-template: v1.2 (customized)
# Reconciled against software/templates/github-actions/ci.yml in the
# automatethethings repo (devops.md §1/§8/§9). Divergence outside the
# repo-specific blocks below is a defect.

name: CI

on:
  push:
    # CUSTOMIZE: this repository's default branch is master. The previous
    # trigger listed only `main`, which matched nothing — no push ever fired a
    # run, and CI had never executed once since adoption.
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

permissions:
  contents: read
  security-events: write

# No GOPROXY/GOSUMDB here, deliberately. GOPRIVATE is injected by the runners
# (dependency-resolution.md §6) and already exempts first-party modules from
# the proxy and the checksum database; `GOPROXY: direct` + `GOSUMDB: off`
# additionally disable sumdb verification for every THIRD-party dependency and
# break the build when an upstream re-points a tag (go-tpm-tools v0.4.8,
# 2026-08-14). ci-template v1.1 forbids both.
env:
  GO_VERSION: '1.26.7'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check formatting
        run: make fmt

      - name: Run go vet
        run: make vet

      # On GITEA this step is skipped: the runner image bakes golangci-lint at
      # v2.12.2, which is this repo's pin exactly. Verified in the image rather
      # than taken from its manifest — /usr/local/bin/golangci-lint self-reports
      # 2.12.2 (#63).
      #
      # On GITHUB it still runs, because `ubuntu-latest` there selects GitHub's
      # hosted image, which ships neither golangci-lint nor govulncheck. This
      # workflow is deliberately dual-plane — see the server_url branches in
      # the trivy job and on every upload-artifact step — so a step removed
      # unconditionally would hold on one plane only. go-signal has no github
      # remote today, but resting the removal on that would be a claim the
      # repository does not enforce, which is the same defect as a suppression
      # whose stated reason nothing checks.
      #
      # Installing it anyway was not free. The install is its own job step, so
      # the sum.golang.org IPv6 failure fails the JOB whether or not the tool is
      # already present; and on success actions/setup-go's bin directory
      # precedes /usr/local/bin on PATH, so a freshly installed binary SHADOWS
      # the baked one — a repo can believe the image pinned its tool while CI
      # runs something else.
      #
      # The pin's reasoning still applies and now belongs to the image, so it is
      # kept here rather than deleted with the step: v2.13.0 (2026-08-19) ships
      # honnef.co/go/tools v0.8.0-rc.1, whose nilness analyzer PANICS on the
      # getsentry/sentry-go dependency —
      #
      #   nilness: package "sentry": internal error: unhandled builtin recover
      #   Running error: can't run linter goanalysis_metalinter
      #
      # — a tool crash, not a finding: the job exits non-zero with zero
      # file:line results, so the gate reads as "your code is bad" while saying
      # nothing about the code. Measured on dev/main with no local changes, so
      # it is the toolchain. v2.12.2 ships honnef.co/go/tools v0.7.0 and is
      # clean.
      #
      # A version change is now an image rebuild (infra/gitea/ci-runner), which
      # is a reviewed change and deliberately not drift. Do not add an install
      # back to move a version.
      #
      # .golangci.yml enables the §8 security linters.
      - name: Install golangci-lint (GitHub-hosted runners only)
        if: github.server_url == 'https://github.com'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Run golangci-lint
        run: make lint

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: [lint, build]  # v1.9 staged fail-fast: expensive tier gates on the fast tier (no cancel API — task #90)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Verify module integrity
        run: make modverify

      # gosec IS still installed here, and it is the ONE tool in this workflow
      # that is: the image bakes v2.29.0 while this repo pins v2.28.0
      # (GOSEC_VERSION in the Makefile). Dropping this step would silently swap
      # the scanner — a version change disguised as a CI cleanup, which is the
      # opposite of what #63 exists to achieve.
      #
      # The divergence is temporary and tracked. v2.29.0 adds G703 and reports
      # two findings on pkg/api/rest/handlers_static.go that v2.28.0 does not;
      # they are real (#68), so the bump waits until they are fixed rather than
      # landing with main red. Remove this step and align the Makefile pin to
      # v2.29.0 in ONE commit once #68 lands, so the version change is visible
      # in the diff rather than implied by a deletion.
      #
      # This step WORKS as a pin because actions/setup-go prepends the Go bin
      # directory to PATH, so the v2.28.0 installed here shadows the baked
      # v2.29.0 at /usr/local/bin/gosec. That shadowing is a hazard everywhere
      # else — it silently un-pins a repo that thinks the image covers it — and
      # is the one place in this workflow it is load-bearing. Verified in the
      # image: `command -v gosec` there resolves to /usr/local/bin/gosec.
      #
      # Read from the Makefile so the version has one definition. At @latest
      # these scanners decided whether the gate was red based on what upstream
      # shipped that morning — red on a diff that touched nothing, or quietly
      # narrower when a rule stopped firing.
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@$(make -s print-gosec-version)

      # Through the Make target, not a restatement of its flags. This job used
      # to spell out the exclude list and omit the build tags, so the scan CI
      # gates on analysed neither pkg/fido2 nor pkg/desktop/... while a local
      # `make gosec` did — and reported success either way. The build tags, the
      # exclude list (each rule justified at GOSEC_EXCLUDE, devops.md §8) and
      # the SARIF flags now have exactly one definition, in the Makefile.
      - name: Run gosec
        run: make gosec GOSEC_FMT=sarif GOSEC_OUT=gosec.sarif

      - name: Upload gosec SARIF
        # Gitea has no code-scanning API; the upload 404s and fails the job.
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.sarif
          category: gosec

      # Skipped on Gitea: the image bakes govulncheck at v1.7.0, this repo's
      # pin exactly, verified in the image rather than from its manifest. Still
      # installed on GitHub, whose hosted image does not carry it — same
      # dual-plane reasoning as the golangci-lint step above.
      #
      # Pinning the binary does not freeze the findings, and must not: the
      # vulnerability database is fetched at run time, so a newly published CVE
      # against a dependency we call still turns this red. That is the gate
      # working, not drift — and it is why a baked scanner is not a stale one.
      - name: Install govulncheck (GitHub-hosted runners only)
        if: github.server_url == 'https://github.com'
        run: go install golang.org/x/vuln/cmd/govulncheck@$(make -s print-govulncheck-version)

      - name: Run govulncheck
        run: make vuln

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    needs: [lint, build]  # v1.9 staged fail-fast: expensive tier gates on the fast tier (no cancel API — task #90)
    steps:
      - uses: actions/checkout@v6

      # Two paths for one gate (devops.md §8). trivy-action's setup step cannot
      # authenticate to github.com from a Gitea runner and upload-sarif has no
      # GHES-compatible endpoint there, so the action path is guarded on the
      # server URL and Gitea gates with the trivy CLI below. Both run the same
      # fs scan at the same severity; only the SARIF upload is GitHub-only.
      #
      # test/ is the integration and performance harness; build/, bin/ and
      # data/ are gitignored local artifacts. None ship.
      - name: Trivy scan (SARIF for code scanning)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          skip-dirs: test,build,bin,data
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        if: github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Trivy gate (fail on CRITICAL/HIGH)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
          skip-dirs: test,build,bin,data
          trivyignores: .trivyignore

      - name: Install Trivy CLI (Gitea)
        if: github.server_url != 'https://github.com'
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy gate (Gitea)
        if: github.server_url != 'https://github.com'
        run: trivy fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 --skip-dirs test,build,bin,data .

  # There is deliberately no trivy-image job yet. None of this repository's
  # Dockerfiles build today, for two independent pre-existing reasons:
  #
  #   Dockerfile, Dockerfile.dev, Dockerfile.service
  #     still `COPY --from=go-libsignal|go-xkms|go-qrdb|go-quicraft`, build
  #     contexts only .devcontainer/docker-compose.yml supplies, so a plain
  #     `docker build .` fails at the first COPY. Residue of the pre-2026-08
  #     local-replace layout; go.mod itself carries no local-path replaces.
  #
  #   deploy/Dockerfile.*
  #     build stage is golang:<stable>-alpine with no git, and the first-party
  #     requires resolve from Gitea, so `go mod download` dies with
  #     'exec: "git": executable file not found in $PATH' before it ever gets
  #     to needing GOPRIVATE and the insteadOf rewrite the host provides.
  #
  # `make trivy-image` carries the ready-to-use scan loop and the full
  # explanation. Add this job, and chain trivy-image into `make security`,
  # once the Dockerfiles can build.

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binaries
        run: make build

      # upload-artifact v4+ refuses to run against any server that is not
      # github.com -- it detects one and reports "not currently supported on
      # GHES", and Gitea presents as such (devops.md §1). The build has already
      # happened by this point; only the artifact upload is skipped.
      - name: Upload artifacts
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v6
        with:
          name: binaries
          path: build/bin/

  fips:
    name: FIPS
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    env:
      GOFIPS140: latest
      GODEBUG: fips140=on
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # The tag set comes from the Makefile, never restated here. Without it
      # this job built with no tags at all: no codec_json meant the dao codec
      # registry had no JSON codec, and cmd/signal/cmd, pkg/daostore and sdk/go
      # failed on every commit, taking CI Gate — the single required check —
      # down with them. `make build` is not a substitute: it links two binaries,
      # while this job's purpose is to compile and test the whole module under
      # GOFIPS140.
      - name: Resolve build tags
        run: echo "BUILD_TAGS=$(make -s print-build-tags)" >> "$GITHUB_ENV"

      - name: Build all packages (FIPS mode)
        run: go build -tags "$BUILD_TAGS" ./...

      - name: Unit tests (FIPS mode)
        run: go test -count=1 -timeout=900s -tags "$BUILD_TAGS" ./...

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, build]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # make test covers ./pkg/..., ./cmd/... and ./sdk/...; make coverage runs
      # the module with -race and applies this repo's own coverage gate. Both
      # are needed: COVERAGE_EXCLUDE_PATTERN removes /cmd/ from the coverage
      # set, so make test is what exercises the cmd packages.
      - name: Run unit tests
        run: make test

      # The coverage gate is `make coverage`, not a threshold re-derived here
      # (devops.md §4 — CI runs what a developer runs). The Makefile applies
      # COVERAGE_EXCLUDE_PATTERN (generated protobuf, /cmd/, frontend, postgres
      # harness) before measuring against COVER_MIN. Computing the percentage
      # in the workflow instead measured the unexcluded tree and compared it to
      # the excluded tree's threshold: 61.3% against a 90 calibrated for the
      # filtered set, i.e. guaranteed red. Filtered, the repo is at 92.7%.
      - name: Coverage gate
        run: make coverage

  # The integration suite lives in integration.yml, on a nightly schedule with
  # workflow_dispatch and a paths filter (devops.md §5). It is not absent and it
  # is not blocked: the sibling-context coupling that made it unrunnable is gone
  # — go.mod carries no local-path replaces, so those four build contexts fed
  # nothing, and the Dockerfiles now resolve first-party modules from Gitea
  # through a BuildKit secret. It sits outside this workflow because it takes
  # over an hour (438 tests, most of the signal-cli ones forking a JVM), and
  # because compose reaches the host daemon through the mounted socket and so
  # escapes the runner's cpu/memory caps. See integration.yml for the full
  # reasoning.

  # The single required check (devops.md §1). Every job above appears in BOTH
  # the needs list and the results check -- a gate that can pass vacuously is
  # worse than no gate. join(needs.*.result) is deliberately not used: it
  # evaluates empty on Gitea and reports success while jobs fail.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, security, trivy, build, test, fips]
    steps:
      - name: Fail closed on any non-success
        run: |
          check() { case "$2" in success) echo "OK   $1";; *) echo "FAIL $1 ($2)"; BAD=1;; esac; }
          BAD=0
          check lint     "${{ needs.lint.result }}"
          check security "${{ needs.security.result }}"
          check trivy    "${{ needs.trivy.result }}"
          check build    "${{ needs.build.result }}"
          check fips        "${{ needs.fips.result }}"
          check test     "${{ needs.test.result }}"
          exit $BAD
