# ci-template: v1.15 (customized)
# Reconciled against software/templates/github-actions/ci.yml in the
# automatethethings repo (devops.md §1/§8/§9). Divergence outside the
# repo-specific blocks below is a defect.
#
# v1.15 (#86, automatethethings#209): every job starts at once (no `needs`
# on lint/build), so a run takes as long as its slowest job; CI Gate still
# needs every job and fails closed. push and pull_request run on main only:
# automerge.yml v7's merge trains are PRs and get CI from pull_request.

name: CI

on:
  push:
    # trunk-based: main is the ONLY trunk (and the default branch).
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:                    # re-fire a whole workflow; also the
                                        # only retry when a run was never
                                        # created (ci-template v1.3)

permissions:
  contents: read
  security-events: write

# No GOPROXY/GOSUMDB here, deliberately. GOPRIVATE is injected by the runners
# (dependency-resolution.md §6) and already exempts first-party modules from
# the proxy and the checksum database; `GOPROXY: direct` + `GOSUMDB: off`
# additionally disable sumdb verification for every THIRD-party dependency and
# break the build when an upstream re-points a tag (go-tpm-tools v0.4.8,
# 2026-08-14). ci-template v1.1 forbids both.
env:
  GO_VERSION: '1.27.4'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check formatting
        run: make fmt

      - name: Run go vet
        run: make vet

      # On GITEA this step is skipped: the runner image bakes golangci-lint at
      # v2.14.0, which is this repo's pin exactly. Verified in the image rather
      # than taken from its manifest — /usr/local/bin/golangci-lint self-reports
      # 2.14.0 (#63, #88).
      #
      # On GITHUB it still runs, because `ubuntu-latest` there selects GitHub's
      # hosted image, which ships neither golangci-lint nor govulncheck. This
      # workflow is deliberately dual-plane — see the server_url branches in
      # the trivy job and on every upload-artifact step — so a step removed
      # unconditionally would hold on one plane only. go-signal has no github
      # remote today, but resting the removal on that would be a claim the
      # repository does not enforce, which is the same defect as a suppression
      # whose stated reason nothing checks.
      #
      # Installing it anyway was not free. The install is its own job step, so
      # the sum.golang.org IPv6 failure fails the JOB whether or not the tool is
      # already present; and on success actions/setup-go's bin directory
      # precedes /usr/local/bin on PATH, so a freshly installed binary SHADOWS
      # the baked one — a repo can believe the image pinned its tool while CI
      # runs something else.
      #
      # The version and the reason WHY live at GOLANGCI_LINT_VERSION in the
      # Makefile, which this step reads — one definition, the same contract as
      # gosec and govulncheck. It was stated here in prose and again in
      # .devcontainer/Dockerfile, and the Dockerfile drifted to an abandoned
      # v2.7.2 (#71).
      #
      # On Gitea a version change is an image rebuild (infra/gitea/ci-runner),
      # a reviewed change and deliberately not drift. Do not add an install
      # back here to move a version.
      #
      # .golangci.yml enables the §8 security linters.
      - name: Install golangci-lint (GitHub-hosted runners only)
        if: github.server_url == 'https://github.com'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@"$(make -s print-golangci-lint-version)"

      # Same contract as the gosec check in the security job: on Gitea nothing
      # installs this, so the pin holds only if PATH resolves to the baked
      # binary — and actions/setup-go prepends the Go bin directory, which is
      # where a stray install would land and shadow it. Trusting the image is
      # an assumption until something checks it.
      #
      # `go version -m` reads the MODULE version, present however the binary was
      # produced. golangci-lint's own --version prints "2.14.0" without the
      # leading v, so it cannot be compared to the pin without massaging.
      - name: Verify the golangci-lint that will run matches the pin
        run: |
          want="$(make -s print-golangci-lint-version)"
          bin="$(command -v golangci-lint)" || { echo "golangci-lint is not on PATH"; exit 1; }
          got="$(go version -m "$bin" | awk '$1 == "mod" && $2 == "github.com/golangci/golangci-lint/v2" { print $3 }')"
          echo "golangci-lint:  $bin"
          echo "  want: $want"
          echo "  got:  ${got:-<unreadable>}"
          if [ "$got" != "$want" ]; then
            echo "golangci-lint version mismatch: the binary on PATH is not the pinned one" >&2
            exit 1
          fi

      # `make lint` ends with actionlint (devops.md §4) and fails when it is
      # absent. GitHub's hosted image does not carry it, and whether a Gitea
      # runner image bakes it is not something this file can assume, so the
      # step installs the pin only when the binary on PATH is not already it,
      # then checks the result the same way as golangci-lint above.
      - name: Install actionlint (unless the pinned one is on PATH)
        run: |
          want="$(make -s print-actionlint-version)"
          have() {
            bin="$(command -v actionlint)" || return 1
            got="$(go version -m "$bin" | awk '$1 == "mod" && $2 == "github.com/rhysd/actionlint" { print $3 }')"
            [ "$got" = "$want" ]
          }
          have || go install github.com/rhysd/actionlint/cmd/actionlint@"$want"
          if ! have; then
            echo "actionlint version mismatch: want $want, got ${got:-<unreadable>} at ${bin:-<not on PATH>}" >&2
            exit 1
          fi
          echo "actionlint:  $bin ($got)"

      - name: Run golangci-lint and actionlint
        run: make lint

      # v1.32 (2026-11-08, Company Agent m2098 item 2, InfoSec finding): the
      # internal-name gate. Its patterns are internal values, so they never
      # live in this repository: the Actions secret RELEASABILITY_PATTERNS
      # carries the private pattern file (source: dept-infosec
      # security/internal-names.patterns). Blank
      # and `#` lines are skipped; every other line is `class<TAB>regex`, a
      # class of coord-host, internal-email, lab-address, lab-host or
      # owner-path (v1.33; an `/i` suffix is allowed) and a POSIX extended regex. A malformed line, an unknown
      # class or a regex grep -E refuses fails the step, which prints the line
      # number only. v1.31 grepped whole lines with -F, so no line matched and
      # the gate was green for a false reason. The step prints path and line
      # of a match, never the value. A run without the secret (a fork PR)
      # skips with a notice; a push to main without it fails.
      - name: Releasability (private patterns)
        if: ${{ !cancelled() }}
        env:
          RELEASABILITY_PATTERNS: ${{ secrets.RELEASABILITY_PATTERNS }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$RELEASABILITY_PATTERNS" ]; then
            if [ "$EVENT" = push ]; then
              echo "::error::RELEASABILITY_PATTERNS is not set; the gate needs the private pattern file (public-hygiene.md)"
              exit 1
            fi
            echo "::notice::RELEASABILITY_PATTERNS is not available to this run; pushes to main run the gate"
            exit 0
          fi
          pf=$(mktemp)
          chmod 600 "$pf"
          trap 'rm -f "$pf"' EXIT
          tab=$(printf '\t')
          n=0 bad=0 count=0
          while IFS= read -r line || [ -n "$line" ]; do
            n=$((n + 1))
            line=${line%$'\r'}
            trimmed=${line#"${line%%[![:space:]]*}"}
            case $trimmed in ''|'#'*) continue ;; esac
            case $line in
              *"$tab"*) ;;
              *) echo "::error::pattern line $n is not class<TAB>regex"; bad=1; continue ;;
            esac
            class=${line%%"$tab"*}
            re=${line#*"$tab"}
            case $class in
              coord-host|internal-email|lab-address|lab-host|owner-path) ;;
              coord-host/i|internal-email/i|lab-address/i|lab-host/i|owner-path/i) ;;
              *) echo "::error::pattern line $n has an unknown class"; bad=1; continue ;;
            esac
            if [ -z "$re" ]; then
              echo "::error::pattern line $n has an empty regex"; bad=1; continue
            fi
            rc=0
            grep -E -e "$re" /dev/null > /dev/null 2>&1 || rc=$?
            if [ "$rc" -ge 2 ]; then
              echo "::error::pattern line $n has a regex grep -E refuses"; bad=1; continue
            fi
            printf '%s\n' "$re" >> "$pf"
            count=$((count + 1))
          done <<< "$RELEASABILITY_PATTERNS"
          if [ "$bad" != 0 ]; then
            echo "::error::the private pattern file is malformed (line numbers above; the values are not shown)"
            exit 1
          fi
          if [ "$count" = 0 ]; then
            echo "::error::RELEASABILITY_PATTERNS holds no class<TAB>regex line"
            exit 1
          fi
          rc=0
          hits=$(git grep -n -I -i -E -f "$pf" -- . | cut -d: -f1,2; exit "${PIPESTATUS[0]}") || rc=$?
          case $rc in
            0)
              echo "::error::internal names in the tracked tree (path:line; the values are not shown):"
              printf '%s\n' "$hits"
              exit 1 ;;
            1) ;;
            *)
              echo "::error::git grep failed (rc $rc)"
              exit 1 ;;
          esac
          echo "releasability: $count private patterns, 0 matches"

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    # No `needs` (v1.15): starts with lint and build, not after them.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Verify module integrity
        run: make modverify

      # Skipped on Gitea: GOSEC_VERSION is now v2.29.0, which is what the
      # ci-runner image bakes, so this repo no longer diverges from it and the
      # step has nothing left to do there. Still installed on GitHub, whose
      # hosted image does not carry gosec — same dual-plane reasoning as the
      # golangci-lint and govulncheck steps.
      #
      # This step used to be the ONE install kept on both planes, because the
      # pin was v2.28.0 against the image's v2.29.0 and dropping it would have
      # swapped the scanner silently. That gap closed with #68: the two G703
      # findings v2.29.0 reported are fixed, and both versions now measure 0
      # issues on both tag sets, so the pin was moved and the step narrowed in
      # ONE commit — the version change is visible in the diff rather than
      # implied by a deletion.
      #
      # Worth keeping in mind if a version ever diverges again: actions/setup-go
      # prepends the Go bin directory to PATH, so an install here SHADOWS
      # /usr/local/bin/gosec. That is a hazard when unintended — it silently
      # un-pins a repo that believes the image covers it — and was load-bearing
      # while the pin differed.
      #
      # Read from the Makefile so the version has one definition. At @latest
      # these scanners decided whether the gate was red based on what upstream
      # shipped that morning — red on a diff that touched nothing, or quietly
      # narrower when a rule stopped firing.
      - name: Install gosec (GitHub-hosted runners only)
        if: github.server_url == 'https://github.com'
        run: go install github.com/securego/gosec/v2/cmd/gosec@"$(make -s print-gosec-version)"

      # A pin is only worth something if the binary that RUNS is the pin, and
      # on Gitea nothing installs gosec any more — the resolution rests entirely
      # on PATH. actions/setup-go prepends the Go bin directory, which is exactly
      # where a stray install would land and silently shadow /usr/local/bin/gosec.
      # Raised in review of this change; this turns the assumption into a
      # checked property rather than a comment asserting one.
      #
      # `go version -m` reads the MODULE version, which is present however the
      # binary was produced — `go install` on GitHub, the image's release build
      # on Gitea. The SELF-reported version cannot be used: a `go install` build
      # reports "dev", which is the unattributable-scan problem in the first
      # place.
      #
      # Verified to fail: pointed at a v2.28.0 build with the pin at v2.29.0,
      # this exits 1 and names both versions.
      - name: Verify the gosec that will run matches the pin
        run: |
          want="$(make -s print-gosec-version)"
          bin="$(command -v gosec)" || { echo "gosec is not on PATH"; exit 1; }
          got="$(go version -m "$bin" | awk '$1 == "mod" && $2 == "github.com/securego/gosec/v2" { print $3 }')"
          echo "gosec:  $bin"
          echo "  want: $want"
          echo "  got:  ${got:-<unreadable>}"
          if [ "$got" != "$want" ]; then
            echo "gosec version mismatch: the binary on PATH is not the pinned one" >&2
            exit 1
          fi

      # Through the Make target, not a restatement of its flags. This job used
      # to spell out the exclude list and omit the build tags, so the scan CI
      # gates on analysed neither pkg/fido2 nor pkg/desktop/... while a local
      # `make gosec` did — and reported success either way. The build tags, the
      # exclude list (each rule justified at GOSEC_EXCLUDE, devops.md §8) and
      # the SARIF flags now have exactly one definition, in the Makefile.
      - name: Run gosec
        run: make gosec GOSEC_FMT=sarif GOSEC_OUT=gosec.sarif

      - name: Upload gosec SARIF
        # Gitea has no code-scanning API; the upload 404s and fails the job.
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.sarif
          category: gosec

      # Skipped on Gitea: the image bakes govulncheck at v1.8.0, this repo's
      # pin exactly, verified in the image rather than from its manifest. Still
      # installed on GitHub, whose hosted image does not carry it — same
      # dual-plane reasoning as the golangci-lint step above.
      #
      # Pinning the binary does not freeze the findings, and must not: the
      # vulnerability database is fetched at run time, so a newly published CVE
      # against a dependency we call still turns this red. That is the gate
      # working, not drift — and it is why a baked scanner is not a stale one.
      - name: Install govulncheck (GitHub-hosted runners only)
        if: github.server_url == 'https://github.com'
        run: go install golang.org/x/vuln/cmd/govulncheck@"$(make -s print-govulncheck-version)"

      - name: Verify the govulncheck that will run matches the pin
        run: |
          want="$(make -s print-govulncheck-version)"
          bin="$(command -v govulncheck)" || { echo "govulncheck is not on PATH"; exit 1; }
          got="$(go version -m "$bin" | awk '$1 == "mod" && $2 == "golang.org/x/vuln" { print $3 }')"
          echo "govulncheck:  $bin"
          echo "  want: $want"
          echo "  got:  ${got:-<unreadable>}"
          if [ "$got" != "$want" ]; then
            echo "govulncheck version mismatch: the binary on PATH is not the pinned one" >&2
            exit 1
          fi

      - name: Run govulncheck
        run: make vuln

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    # No `needs` (v1.15): starts with lint and build, not after them.
    steps:
      - uses: actions/checkout@v6

      # Two paths for one gate (devops.md §8). trivy-action's setup step cannot
      # authenticate to github.com from a Gitea runner and upload-sarif has no
      # GHES-compatible endpoint there, so the action path is guarded on the
      # server URL and Gitea gates with the trivy CLI below. Both run the same
      # fs scan at the same severity; only the SARIF upload is GitHub-only.
      #
      # test/ is the integration and performance harness; build/, bin/ and
      # data/ are gitignored local artifacts. None ship.
      - name: Trivy scan (SARIF for code scanning)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          skip-dirs: test,build,bin,data
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        if: github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Trivy gate (fail on CRITICAL/HIGH)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
          skip-dirs: test,build,bin,data
          trivyignores: .trivyignore

      - name: Install Trivy CLI (Gitea)
        if: github.server_url != 'https://github.com'
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy gate (Gitea)
        if: github.server_url != 'https://github.com'
        run: trivy fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 --skip-dirs test,build,bin,data .

  # There is deliberately no trivy-image job yet. None of this repository's
  # Dockerfiles build today, for two independent pre-existing reasons:
  #
  #   Dockerfile, Dockerfile.dev, Dockerfile.service
  #     still `COPY --from=go-libsignal|go-xkms|go-qrdb|go-quicraft`, build
  #     contexts only .devcontainer/docker-compose.yml supplies, so a plain
  #     `docker build .` fails at the first COPY. Residue of the pre-2026-08
  #     local-replace layout; go.mod itself carries no local-path replaces.
  #
  #   deploy/Dockerfile.*
  #     build stage is golang:<stable>-alpine with no git, and the first-party
  #     requires resolve from Gitea, so `go mod download` dies with
  #     'exec: "git": executable file not found in $PATH' before it ever gets
  #     to needing GOPRIVATE and the insteadOf rewrite the host provides.
  #
  # `make trivy-image` carries the ready-to-use scan loop and the full
  # explanation. Add this job, and chain trivy-image into `make security`,
  # once the Dockerfiles can build.

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binaries
        run: make build

      # upload-artifact v4+ refuses to run against any server that is not
      # github.com -- it detects one and reports "not currently supported on
      # GHES", and Gitea presents as such (devops.md §1). The build has already
      # happened by this point; only the artifact upload is skipped.
      - name: Upload artifacts
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v6
        with:
          name: binaries
          path: build/bin/

  fips:
    name: FIPS
    runs-on: ubuntu-latest
    # No `needs` (v1.15): starts with lint and build, not after them.
    timeout-minutes: 30
    env:
      GOFIPS140: latest
      GODEBUG: fips140=on
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # The tag set comes from the Makefile, never restated here. Without it
      # this job built with no tags at all: no codec_json meant the dao codec
      # registry had no JSON codec, and cmd/signal/cmd, pkg/daostore and sdk/go
      # failed on every commit, taking CI Gate — the single required check —
      # down with them. `make build` is not a substitute: it links two binaries,
      # while this job's purpose is to compile and test the whole module under
      # GOFIPS140.
      - name: Resolve build tags
        run: echo "BUILD_TAGS=$(make -s print-build-tags)" >> "$GITHUB_ENV"

      - name: Build all packages (FIPS mode)
        run: go build -tags "$BUILD_TAGS" ./...

      - name: Unit tests (FIPS mode)
        run: go test -count=1 -timeout=900s -tags "$BUILD_TAGS" ./...

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    # No `needs` (v1.15): starts with lint and build, not after them.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # make test covers ./pkg/..., ./cmd/... and ./sdk/...; make coverage runs
      # the module with -race and applies this repo's own coverage gate. Both
      # are needed: COVERAGE_EXCLUDE_PATTERN removes /cmd/ from the coverage
      # set, so make test is what exercises the cmd packages.
      - name: Run unit tests
        run: make test

      # The coverage gate is `make coverage`, not a threshold re-derived here
      # (devops.md §4 — CI runs what a developer runs). The Makefile applies
      # COVERAGE_EXCLUDE_PATTERN (generated protobuf, /cmd/, frontend, postgres
      # harness) before measuring against COVER_MIN. Computing the percentage
      # in the workflow instead measured the unexcluded tree and compared it to
      # the excluded tree's threshold: 61.3% against a 90 calibrated for the
      # filtered set, i.e. guaranteed red. Filtered, the repo is at 92.7%.
      - name: Coverage gate
        run: make coverage

  # The integration suite lives in integration.yml, on a nightly schedule with
  # workflow_dispatch and a paths filter (devops.md §5). It is not absent and it
  # is not blocked: the sibling-context coupling that made it unrunnable is gone
  # — go.mod carries no local-path replaces, so those four build contexts fed
  # nothing, and the Dockerfiles now resolve first-party modules from Gitea
  # through a BuildKit secret. It sits outside this workflow because it takes
  # over an hour (438 tests, most of the signal-cli ones forking a JVM), and
  # because compose reaches the host daemon through the mounted socket and so
  # escapes the runner's cpu/memory caps. See integration.yml for the full
  # reasoning.

  # The single required check (devops.md §1). Every job above appears in BOTH
  # the needs list and the results check -- a gate that can pass vacuously is
  # worse than no gate. join(needs.*.result) is deliberately not used: it
  # evaluates empty on Gitea and reports success while jobs fail.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, security, trivy, build, test, fips]
    steps:
      - name: Fail closed on any non-success
        run: |
          check() { case "$2" in success) echo "OK   $1";; *) echo "FAIL $1 ($2)"; BAD=1;; esac; }
          BAD=0
          check lint     "${{ needs.lint.result }}"
          check security "${{ needs.security.result }}"
          check trivy    "${{ needs.trivy.result }}"
          check build    "${{ needs.build.result }}"
          check fips        "${{ needs.fips.result }}"
          check test     "${{ needs.test.result }}"
          exit $BAD
