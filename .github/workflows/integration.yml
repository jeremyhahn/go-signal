# Integration suite against a live stack (signald over TLS, postgres, redis, signal-cli); runs over an hour, so it runs nightly, by hand, and on pushes touching the paths below.

name: Integration

on:
  schedule:
    # 02:00 UTC daily.
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [master, main, develop]
    paths:
      - 'Dockerfile'
      - 'Dockerfile.dev'
      - 'Dockerfile.service'
      - '.devcontainer/**'
      - 'test/integration/**'
      - 'test/signal-cli/**'
      - '.dockerignore'
      # The devcontainer image reads its tool pins from the Makefile, so a pin change rebuilds the image and runs this suite.
      - 'Makefile'
      # The Makefile includes mk/release-alpha.mk and mk/release-common.mk,
      # which the devcontainer image copies beside it.
      - 'mk/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/integration.yml'
      # The server code the suite exercises. Without these a merge can change
      # message delivery and never run the suite that proves delivery works.
      - 'pkg/**'
      - 'cmd/**'
      - 'sdk/**'

permissions:
  contents: read

jobs:
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    # The suite takes about 86 minutes; the cap must exceed the suite's own go test -timeout 120m.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6

      # The suite itself compiles inside a container, but the Makefile evaluates
      # `$(shell go env ...)` while parsing, so without a toolchain on the
      # runner every target starts with "make: go: No such file or directory".
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'

      # Module credentials are needed at build and run time; staged under RUNNER_TEMP, outside the build context, read from the shell environment.
      - name: Stage module-fetch credentials
        run: |
          set -eu
          umask 077
          : > "${RUNNER_TEMP}/gomodauth.env"
          if [ -n "${GIT_CONFIG_KEY_0:-}" ]; then
            {
              printf 'export GOPRIVATE=%s\n' "${GOPRIVATE:-}"
              printf 'export GIT_CONFIG_COUNT=%s\n' "${GIT_CONFIG_COUNT:-}"
              printf 'export GIT_CONFIG_KEY_0=%s\n' "${GIT_CONFIG_KEY_0}"
              printf 'export GIT_CONFIG_VALUE_0=%s\n' "${GIT_CONFIG_VALUE_0:-}"
            } > "${RUNNER_TEMP}/gomodauth.env"
            echo "staged Gitea module credentials"
          else
            echo "no Gitea credentials in this environment; resolving from the public proxy"
          fi

      # GOMODAUTH_ENV is what compose interpolates into the `gomodauth` secret;
      # the four GIT_/GOPRIVATE variables are inherited by the integration
      # container, which needs them at run time to compile the suite.
      - name: Run integration suite
        env:
          GOMODAUTH_ENV: ${{ runner.temp }}/gomodauth.env
          DOCKER_BUILDKIT: '1'
        run: make integration-test

      - name: Remove staged credentials
        if: always()
        run: rm -f "${RUNNER_TEMP}/gomodauth.env"

      # Remove the named volumes so no state carries from one run into the next.
      - name: Tear down the stack
        if: always()
        run: docker compose -f .devcontainer/docker-compose.yml down -v --remove-orphans || true

      - name: Upload integration log
        if: always() && github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-log
          path: build/integration-test.log

  # One required check, every job listed explicitly, failing closed.
  integration-gate:
    name: Integration Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [integration-test]
    steps:
      - name: Fail closed on any non-success
        run: |
          check() { case "$2" in success) echo "OK   $1";; *) echo "FAIL $1 ($2)"; BAD=1;; esac; }
          BAD=0
          check integration-test "${{ needs.integration-test.result }}"
          exit $BAD
